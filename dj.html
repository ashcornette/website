<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pair Cycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<style>
/* Layout: one screen. Two flat colour slabs (dancer A / dancer B) fill the stage, twist line under them, big Next below. Settings open in-flow under the controls. No borders anywhere. */
:root {
  --bg: #EDEBE6;
  --ink: #141413;
  --mute: #6A6963;
  --surface: #DEDBD3;
  --on-ink: #EDEBE6;
  --display: 'Roboto Flex', 'Arial Narrow', Arial, sans-serif;
  --ui: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0F0E; --ink: #EFEDE7; --mute: #9C9A93; --surface: #1C1C1A; --on-ink: #0F0F0E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0F0E; --ink: #EFEDE7; --mute: #9C9A93; --surface: #1C1C1A; --on-ink: #0F0F0E;
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 1rem;
  padding-inline: 16px;
  padding-block: 16px;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.app {
  min-height: 100%;
  max-width: 1400px;
  margin-inline: auto;
  display: grid;
  grid-template-rows: auto minmax(340px, 1fr) auto auto auto;
  gap: 14px;
}

/* top bar */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.brand {
  font-family: var(--display);
  font-variation-settings: 'wdth' 135, 'wght' 800, 'opsz' 40;
  font-size: 1.25rem;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.top-right { display: flex; align-items: center; gap: 16px; }
.count {
  font-family: var(--display);
  font-variation-settings: 'wdth' 110, 'wght' 600, 'opsz' 20;
  font-variant-numeric: tabular-nums;
  color: var(--mute);
  font-size: 1rem;
}
.link-btn {
  font-weight: 600; font-size: .9375rem; text-transform: uppercase; letter-spacing: .08em;
  padding: 8px 12px; background: var(--surface); border-radius: 4px;
}
.link-btn[aria-expanded="true"] { background: var(--ink); color: var(--on-ink); }

/* stage */
.stage { position: relative; display: grid; grid-template-rows: 1fr; min-height: 0; }
.panel {
  container-type: size;
  position: relative;
  overflow: hidden;
  background: var(--pbg, var(--surface));
  color: var(--pfg, var(--ink));
  padding: 16px 20px;
  display: flex; flex-direction: column; justify-content: space-between;
  border-radius: 2px;
}
.who {
  font-weight: 600; font-size: .8125rem; text-transform: uppercase; letter-spacing: .14em; opacity: .75;
}
.name {
  font-family: var(--display);
  font-variation-settings: 'wdth' 118, 'wght' 860, 'opsz' 144;
  font-size: clamp(2.6rem, 15cqw, 13rem);
  line-height: .92;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.fig {
  position: absolute; top: 14px; right: 20px; left: 20px;
  bottom: calc(clamp(2.6rem, 15cqw, 13rem) * .92 + 36px);
  display: flex; align-items: center; justify-content: flex-end;
  font-size: min(50cqw, 13rem, max(3.5rem, calc(100cqh - clamp(2.6rem, 15cqw, 13rem) * .92 - 70px))); line-height: 1;
  font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  overflow: hidden;
}
.cd {
  position: absolute; left: 20px; top: 54px; z-index: 1;
  font-family: var(--display);
  font-variation-settings: 'wdth' 125, 'wght' 900, 'opsz' 144;
  font-size: clamp(5rem, 28cqw, 12rem); line-height: .85;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; pointer-events: none; }
.bar i { display: block; height: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); }

/* twist */
.twist { display: flex; align-items: center; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; min-height: 2.6rem; }
.tw { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; min-width: 0; }
.upnext {
  display: inline-flex; align-items: center; gap: 10px; margin-left: auto;
  padding: 8px 14px; border-radius: 4px;
  background: var(--nbg); color: var(--nfg);
  font-family: var(--display);
  font-variation-settings: 'wdth' 118, 'wght' 800, 'opsz' 28;
  text-transform: uppercase; letter-spacing: .01em; font-size: 1.125rem; line-height: 1;
}
.upnext .em { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; font-size: 1.4rem; }
.twist .upnext .tag { color: inherit; opacity: .7; font-family: var(--ui); font-weight: 700; font-size: .75rem; }
.twist .tag { font-weight: 600; font-size: .8125rem; text-transform: uppercase; letter-spacing: .14em; color: var(--mute); }
.twist .txt {
  font-family: var(--display);
  font-variation-settings: 'wdth' 100, 'wght' 650, 'opsz' 28;
  font-size: clamp(1.25rem, 3.4vw, 1.9rem);
  letter-spacing: -0.005em;
}

/* controls */
.controls { display: grid; grid-template-columns: 1fr 2.2fr 1.4fr 1fr; gap: 8px; }
.btn {
  height: 64px; border-radius: 4px; background: var(--surface);
  font-weight: 700; font-size: 1rem; letter-spacing: .04em; text-transform: uppercase;
  display: grid; place-items: center; padding-inline: 8px;
}
.btn.primary {
  background: var(--ink); color: var(--on-ink);
  font-family: var(--display);
  font-variation-settings: 'wdth' 125, 'wght' 800, 'opsz' 40;
  font-size: 1.375rem;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn .t { font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .controls { grid-template-columns: 1fr 1.5fr 1fr; } .btn.primary { grid-column: 1 / -1; order: -1; } }

/* settings */
.sheet { background: var(--surface); padding: 20px; border-radius: 4px; display: grid; gap: 22px; }
.sheet h2 {
  margin: 0 0 10px; font-weight: 600; font-size: .8125rem; text-transform: uppercase; letter-spacing: .14em; color: var(--mute);
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: 4px; font-weight: 700; font-size: .9375rem;
  background: var(--bg); color: var(--mute);
}
.chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--c); color: var(--f); }
.chip[aria-pressed="true"] i { background: var(--f); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button {
  padding: 12px 18px; border-radius: 4px; font-weight: 700; background: var(--bg); color: var(--mute);
  font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.switch-row span { font-weight: 600; }
.switch-row small { display: block; color: var(--mute); font-weight: 400; margin-top: 2px; }
.sw { width: 52px; height: 30px; border-radius: 15px; background: var(--bg); position: relative; flex: none; }
.sw::after { content: ''; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--mute); transition: transform .15s, background .15s; }
.sw[aria-checked="true"] { background: var(--ink); }
.sw[aria-checked="true"]::after { transform: translateX(22px); background: var(--on-ink); }
.sheet-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hint { color: var(--mute); font-size: .9375rem; min-height: 1.4em; margin: 0; }
.keys { color: var(--mute); font-size: .875rem; margin: 0; }
.keys b { color: var(--ink); font-weight: 700; }

@media (prefers-reduced-motion: reduce) { .sw::after { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">Pair Cycle</div>
    <div class="top-right">
      <span class="count" id="count" aria-label="Position in deck">01 / 07</span>
      <button class="link-btn" id="openSheet" aria-expanded="false" aria-controls="sheet">Setup</button>
    </div>
  </header>

  <section class="stage" aria-live="polite" aria-label="Current style">
    <div class="panel" id="pa"><div class="who">Style</div><div class="fig" id="fig" aria-hidden="true"></div><div class="cd" id="cd" hidden aria-hidden="true"></div><div class="name" id="na"></div></div>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  </section>

  <div class="twist">
    <span class="tw" id="twistRow"><span class="tag">Twist</span><span class="txt" id="twist"></span></span>
    <span class="upnext" id="upnext"><span class="tag">Up next</span><span class="em" id="upem"></span><span id="upname"></span></span>
  </div>

  <div class="controls">
    <button class="btn" id="back">Back</button>
    <button class="btn primary" id="next">Next style</button>
    <button class="btn" id="timerBtn"><span class="t" id="timerTxt">Start</span></button>
    <button class="btn" id="resetBtn">Reset</button>
  </div>

  <section class="sheet" id="sheet" hidden>
    <div>
      <h2>Styles in the deck</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div>
      <h2>Round length</h2>
      <div class="seg" id="seg"></div>
    </div>
    <div class="switch-row">
      <span>Show a twist<small>A tempo, level or connection rule for the round.</small></span>
      <button class="sw" id="swTwist" role="switch" aria-checked="true" aria-label="Show a twist"></button>
    </div>
    <div class="sheet-foot">
      <button class="link-btn" id="reshuffle" style="background:var(--bg)">Reshuffle deck</button>
      <p class="hint" id="hint" aria-live="polite"></p>
    </div>
    <p class="keys"><b>Space</b> or <b>→</b> next &nbsp; <b>←</b> back &nbsp; <b>T</b> timer &nbsp; <b>R</b> reset timer &nbsp; <b>S</b> reshuffle</p>
  </section>
</div>

<script>
(function () {
  var STYLES = [
    { id: 'hiphop',   name: 'Hip Hop',  bg: '#F2B705', fg: '#141413' },
    { id: 'locking',  name: 'Locking',  bg: '#E4572E', fg: '#141413' },
    { id: 'popping',  name: 'Popping',  bg: '#4FB0E0', fg: '#141413' },
    { id: 'memphis',  name: 'Memphis',  bg: '#8CCB2A', fg: '#141413' },
    { id: 'waacking', name: 'Waacking', bg: '#FF6F9C', fg: '#141413' },
    { id: 'house',    name: 'House',    bg: '#1F6F5C', fg: '#F3F0E8' },
    { id: 'breaking', name: 'Breaking', bg: '#2B2B29', fg: '#F3F0E8' }
  ];
  var BY = {}; STYLES.forEach(function (s) { BY[s.id] = s; });
  var FIGS = {
    hiphop: '🎤', locking: '🔒', popping: '💥', memphis: '👟',
    waacking: '💃', house: '🏠', breaking: '🌀'
  };
  STYLES.forEach(function (x) { x.fig = FIGS[x.id]; });
  var TWISTS = [
    'Half-time', 'Double-time', 'Stay low', 'Stay high', 'Mirror each other',
    'Call and response, 8 counts each', 'Trade every 4 counts', 'Keep one point of contact',
    'Freeze on every 8', 'Travel the whole floor', 'Smallest movements only', 'Swap styles halfway'
  ];
  var LENGTHS = [20, 35, 50];
  var KEY = 'pair-cycle-v6';

  var DEF = { on: STYLES.map(function (s) { return s.id; }), twist: true, secs: 35 };
  var st = load();
  function load() {
    try {
      var r = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (r && Array.isArray(r.on)) {
        var on = STYLES.map(function (s) { return s.id; }).filter(function (id) { return r.on.indexOf(id) > -1; });
        if (on.length) return { on: on, twist: r.twist !== false, secs: LENGTHS.indexOf(r.secs) > -1 ? r.secs : 35 };
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEF));
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  var deck = [], pos = 0, queued = null;
  function buildDeck(prevLast) {
    var deck = shuffle(st.on.map(function (id) { return { id: id, twist: pick(TWISTS) }; }));
    if (prevLast && deck.length > 1 && deck[0].id === prevLast.id) {
      var k = deck.length - 1, t = deck[0]; deck[0] = deck[k]; deck[k] = t;
    }
    return deck;
  }
  function newDeck() { deck = buildDeck(null); pos = 0; queued = null; }
  function peek() {
    if (pos < deck.length - 1) return deck[pos + 1];
    if (!queued) queued = buildDeck(deck[deck.length - 1]);
    return queued[0];
  }

  function next(fromTimer) {
    if (pos >= deck.length - 1) { deck = queued || buildDeck(deck[deck.length - 1]); queued = null; pos = 0; } else { pos++; }
    if (running && !fromTimer) endAt = Date.now() + st.secs * 1000;
    render(true);
  }
  function back() {
    if (pos > 0) { pos--; if (running) endAt = Date.now() + st.secs * 1000; render(true); }
  }

  function paint(el, nameEl, id) {
    var s = BY[id];
    el.style.setProperty('--pbg', s.bg);
    el.style.setProperty('--pfg', s.fg);
    nameEl.textContent = s.name;
    $('fig').textContent = s.fig;
    if (!reduce && el.animate) el.animate(
      [{ transform: 'translateY(16px)', opacity: 0.2 }, { transform: 'none', opacity: 1 }],
      { duration: 240, easing: 'cubic-bezier(.2,.7,.2,1)' });
  }
  function render(animate) {
    var d = deck[pos];
    if (animate === true) { paint($('pa'), $('na'), d.id); }
    else { var rm = reduce; reduce = true; paint($('pa'), $('na'), d.id); reduce = rm; }
    $('twist').textContent = d.twist;
    $('twistRow').style.visibility = st.twist ? 'visible' : 'hidden';
    var n = function (x) { return (x < 10 ? '0' : '') + x; };
    $('count').textContent = n(pos + 1) + ' / ' + n(deck.length);
    $('back').disabled = pos === 0;
    showNext();
  }

  /* timer */
  var running = false, endAt = 0, tick = null, pausedRem = 0, lock = null;
  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
  function renderTimer(rem) {
    var b = $('timerBtn'), t = $('timerTxt');
    $('resetBtn').disabled = !st.secs || (!running && !pausedRem);
    if (!st.secs) { b.disabled = true; t.textContent = 'Timer off'; $('barfill').style.transform = 'scaleX(0)'; return; }
    b.disabled = false;
    if (running) { t.textContent = 'Pause ' + fmt(rem == null ? endAt - Date.now() : rem); }
    else { t.textContent = pausedRem ? 'Resume ' + fmt(pausedRem) : 'Start ' + st.secs + 's'; }
  }
  var shownNext = null;
  function showNext() {
    var el = $('upnext'), key = peek().id;
    if (shownNext === key) return;
    var changed = shownNext !== null;
    shownNext = key;
    var x = BY[key];
    el.style.setProperty('--nbg', x.bg); el.style.setProperty('--nfg', x.fg);
    $('upem').textContent = x.fig; $('upname').textContent = x.name; el.hidden = false;
    if (changed && !reduce && el.animate) el.animate([{ transform: 'translateY(8px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: 'cubic-bezier(.2,.7,.2,1)' });
  }
  var lastCd = 0;
  function setCd(rem) {
    var el = $('cd'), n = Math.ceil(rem / 1000);
    if (running && n >= 1 && n <= 5) {
      if (n !== lastCd) {
        lastCd = n; el.textContent = n; el.hidden = false;
        if (!reduce && el.animate) el.animate([{ transform: 'scale(1.35)', opacity: 0.3 }, { transform: 'none', opacity: 1 }], { duration: 260, easing: 'cubic-bezier(.2,.7,.2,1)' });
      }
    } else if (lastCd) { lastCd = 0; el.hidden = true; }
  }
  function onTick() {
    var rem = endAt - Date.now();
    if (rem <= 0) {
      try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
      next(true); endAt = Date.now() + st.secs * 1000; rem = st.secs * 1000;
    }
    $('barfill').style.transform = 'scaleX(' + (rem / (st.secs * 1000)).toFixed(4) + ')';
    setCd(rem);
    renderTimer(rem);
  }
  function startTimer() {
    if (!st.secs) return;
    running = true;
    endAt = Date.now() + (pausedRem || st.secs * 1000); pausedRem = 0;
    clearInterval(tick); tick = setInterval(onTick, 200);
    try { if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {}); } catch (e) {}
    onTick();
  }
  function pauseTimer() {
    pausedRem = Math.max(0, endAt - Date.now());
    running = false; clearInterval(tick); setCd(0);
    try { lock && lock.release(); } catch (e) {} lock = null;
    renderTimer();
  }
  function resetTimer() {
    running = false; clearInterval(tick); pausedRem = 0; setCd(0); $('barfill').style.transform = 'scaleX(0)';
    try { lock && lock.release(); } catch (e) {} lock = null;
    renderTimer();
  }
  function toggleTimer() { running ? pauseTimer() : startTimer(); }

  /* setup sheet */
  var hintTimer;
  function hint(msg) { $('hint').textContent = msg; clearTimeout(hintTimer); hintTimer = setTimeout(function () { $('hint').textContent = ''; }, 4000); }

  function drawChips() {
    var box = $('chips'); box.innerHTML = '';
    STYLES.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'chip'; b.id = 'chip-' + s.id;
      b.style.setProperty('--c', s.bg); b.style.setProperty('--f', s.fg);
      b.setAttribute('aria-pressed', st.on.indexOf(s.id) > -1 ? 'true' : 'false');
      b.innerHTML = '<i></i>' + s.name;
      b.addEventListener('click', function () {
        var on = st.on.indexOf(s.id) > -1;
        if (on) {
          if (st.on.length <= 1) { hint('Keep at least 1 style on.'); return; }
          st.on = st.on.filter(function (x) { return x !== s.id; });
        } else {
          st.on = STYLES.map(function (x) { return x.id; }).filter(function (id) { return st.on.indexOf(id) > -1 || id === s.id; });
        }
        save(); drawChips(); newDeck(); if (running) { endAt = Date.now() + st.secs * 1000; } render(true);
      });
      box.appendChild(b);
    });
  }
  function drawSeg() {
    var box = $('seg'); box.innerHTML = '';
    LENGTHS.forEach(function (n) {
      var b = document.createElement('button');
      b.id = 'len-' + n; b.textContent = n ? n + 's' : 'Off';
      b.setAttribute('aria-pressed', st.secs === n ? 'true' : 'false');
      b.addEventListener('click', function () { st.secs = n; save(); resetTimer(); drawSeg(); });
      box.appendChild(b);
    });
  }
  function drawSwitches() {
    $('swTwist').setAttribute('aria-checked', st.twist ? 'true' : 'false');
  }
  $('swTwist').addEventListener('click', function () { st.twist = !st.twist; save(); drawSwitches(); render(false); });
  $('reshuffle').addEventListener('click', function () { newDeck(); render(true); hint('Deck reshuffled.'); });
  $('openSheet').addEventListener('click', function () {
    var open = $('sheet').hidden;
    $('sheet').hidden = !open;
    $('openSheet').setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) { try { $('sheet').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {} }
  });

  $('next').addEventListener('click', function () { next(false); });
  $('back').addEventListener('click', back);
  $('timerBtn').addEventListener('click', toggleTimer);
  $('resetBtn').addEventListener('click', resetTimer);

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (e.key === ' ' && tag === 'BUTTON') return;
    if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next(false); }
    else if (e.key === 'ArrowLeft') { back(); }
    else if (e.key === 't' || e.key === 'T') { toggleTimer(); }
    else if (e.key === 'r' || e.key === 'R') { resetTimer(); }
    else if (e.key === 's' || e.key === 'S') { newDeck(); render(true); }
  });

  newDeck(); drawChips(); drawSeg(); drawSwitches(); render(false); renderTimer();
})();
</script>
